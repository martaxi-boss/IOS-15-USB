name: IOS15 Disassembly Blob Bridge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging main
        uses: actions/checkout@v4

      - name: Materialize and publish exact disassembly blob
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat .archive-transport/VCamRecovered.disassembly.part.* > /tmp/VCamRecovered.disassembly.txt

          test "$(stat -c '%s' /tmp/VCamRecovered.disassembly.txt)" = "5651132"

          printf '%s  %s\n'             'aa907158343b963bdeed1b51a3f6b5c8989b524dfa009f946258042cef8f7459'             '/tmp/VCamRecovered.disassembly.txt' | sha256sum -c -

          actual_git_blob="$(git hash-object /tmp/VCamRecovered.disassembly.txt)"
          test "$actual_git_blob" = "50e56ac5e0604ad88c81c78d6b909c0559b32ae9"

          python3 - <<'PY'
          import base64
          import json

          with open('/tmp/VCamRecovered.disassembly.txt', 'rb') as f:
              data = f.read()

          with open('/tmp/blob-request.json', 'w', encoding='utf-8') as f:
              json.dump(
                  {'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'},
                  f,
                  separators=(',', ':'),
              )
          PY

          status="$(
            curl -sS               -o /tmp/blob-response.json               -w '%{http_code}'               -X POST               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $GITHUB_TOKEN"               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs"               --data-binary @/tmp/blob-request.json
          )"

          test "$status" = "201"

          returned_sha="$(
            python3 - <<'PY'
          import json
          with open('/tmp/blob-response.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['sha'])
          PY
          )"

          test "$returned_sha" = "50e56ac5e0604ad88c81c78d6b909c0559b32ae9"

          curl -sS             -o /tmp/remote-blob.json             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $GITHUB_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$returned_sha"

          python3 - <<'PY'
          import base64
          import hashlib
          import json

          with open('/tmp/remote-blob.json', 'r', encoding='utf-8') as f:
              obj = json.load(f)

          data = base64.b64decode(obj['content'].replace('\n', ''), validate=False)

          assert len(data) == 5651132
          assert hashlib.sha256(data).hexdigest() == 'aa907158343b963bdeed1b51a3f6b5c8989b524dfa009f946258042cef8f7459'

          with open('/tmp/remote-disassembly.txt', 'wb') as f:
              f.write(data)
          PY

          remote_git_blob="$(git hash-object /tmp/remote-disassembly.txt)"
          test "$remote_git_blob" = "50e56ac5e0604ad88c81c78d6b909c0559b32ae9"

          echo 'DISASSEMBLY_BLOB_BRIDGE=PASS'
          echo 'DISASSEMBLY_GIT_BLOB_SHA=50e56ac5e0604ad88c81c78d6b909c0559b32ae9'
